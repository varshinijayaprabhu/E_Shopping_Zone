server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # Route: Profile Service (Auth & Profiles)
        - id: profile-service-auth
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: profile-service-profile
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/profile/**
        - id: profile-service-oauth2
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/oauth2/**, /login/oauth2/**
          filters:
            - PreserveHostHeader

        # Route: Product Service (Catalog & Categories)
        - id: product-service-products
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
        - id: product-service-categories
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/categories/**

        # Route: Cart Service (Shopping Cart)
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**

        # Route: Order Service (Orders & Checkout)
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        # Route: Wallet Service (Digital Ledger)
        - id: wallet-service
          uri: lb://WALLET-SERVICE
          predicates:
            - Path=/api/wallet/**

        # Route: Admin Service (Platform Governance, Merchant Bans, Disputes)
        - id: admin-service-admin
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/admin/**
        - id: admin-service-disputes
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/disputes/**
      loadbalancer:
        cache:
          ttl: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  file:
    name: logs/api-gateway.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.eshopping.gateway: DEBUG

