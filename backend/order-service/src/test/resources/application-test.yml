server:
  port: 0

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:order_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

